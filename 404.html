<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 - TheBenMeadows</title>
        <meta name="description" content="Page not found" />
        <link rel="icon" href="favicon/favicon.ico" type="image/x-icon" />
        <style>
            @font-face {
                font-family: "Public Sans";
                src: url("/fonts/publicsans-v1.woff2") format("woff2-variations");
                font-weight: 400 700;
                font-display: swap;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: #000;
                color: #a3a3a3;
                font-family: "Public Sans", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                text-align: center;
            }
            .container {
                padding: 2rem;
            }
            .mark {
                display: inline-block;
                border: 0;
                padding: 0;
                margin-bottom: 2rem;
            }
            .mark:hover {
                border: 0;
            }
            .mark img {
                display: block;
                width: 64px;
                height: 28px;
            }
            h1 {
                font-size: 6rem;
                font-weight: 900;
                color: #fff;
                line-height: 1;
                margin-bottom: 0.5rem;
            }
            p {
                font-size: 1.125rem;
                margin-bottom: 2rem;
            }
            a {
                display: inline-block;
                color: #a3a3a3;
                text-decoration: none;
                border: 1px solid #a3a3a3;
                padding: 0.75rem 2rem;
                font-size: 0.875rem;
                font-weight: 600;
                border-radius: 0.75rem;
                transition: color 0.2s, border-color 0.2s;
            }
            a:hover {
                color: #fff;
                border-color: #fff;
            }
            @media (prefers-color-scheme: light) {
                body { background: #ffffff; color: #52525b; }
                h1 { color: #000000; }
                a { color: #52525b; border-color: #52525b; }
                a:hover { color: #000000; border-color: #000000; }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <!-- Root-relative on purpose: an absolute apex URL would bounce visitors
                 off the Netlify/pages.dev mirrors, which is exactly the failover the
                 mirrors exist to provide. This page stays self-contained (its own CSS,
                 no output.css) so it still renders when the stylesheet is the thing
                 that failed to load. -->
            <a class="mark" href="/" aria-label="TheBenMeadows — home">
                <img src="/btm-logo.png" alt="" width="64" height="28" />
            </a>
            <h1>404</h1>
            <p>Page not found</p>
            <a href="/">Back to Home</a>
        </div>
    </body>
</html>
