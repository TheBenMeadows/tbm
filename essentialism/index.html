<!doctype html>
<!--
    essentialism moved to /art/essentialism/ on 2026-08-16. This file is the
    forwarding stub, and it is a FILE rather than a rule in _redirects on
    purpose.

    /essentialism/ is a published address. It is pinned into the Arweave
    snapshot, the IPNS root, the nsite copy, the ZIM and the torrent, and none
    of those has a redirect layer to configure -- a rule in _redirects moves the
    address on the apex and leaves it broken on every surface this site exists
    on to survive the apex. A stub is bytes, so it travels with the bytes and
    behaves the same everywhere.

    The cost is that the apex forwards with a meta refresh instead of a 301.
    The canonical link below is what tells indexers where the page went; the
    visible link is what works when script and refresh are both off.

    Do not fold a matching rule into _redirects. /tbm/essentialism/index.html
    rewrites here for the BitTorrent webseed, and a 3xx on a webseed drops the
    seed -- the failure the named rows in _redirects exist to avoid.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="essentialism now lives at thebenmeadows.com/art/essentialism/." />
        <meta name="color-scheme" content="dark light" />
        <meta http-equiv="refresh" content="0; url=/art/essentialism/" />
        <link rel="canonical" href="https://thebenmeadows.com/art/essentialism/" />

        <title>essentialism moved · TheBenMeadows</title>
        <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
        <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />

        <link rel="icon" href="/favicon/favicon.ico" type="image/x-icon" />
        <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
        <link rel="manifest" href="/favicon/site.webmanifest" />

        <link
            rel="preload"
            href="/fonts/publicsans-v1.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="/output.css" />
        <script src="/theme.js"></script>
    </head>
    <body id="top" class="bg-black">
        <main class="text-neutral-400 max-w-screen-md mx-auto px-6 pt-12 pb-12 leading-relaxed text-center">
            <h1 class="text-white text-3xl font-bold" style="letter-spacing: -0.025em">essentialism moved</h1>
            <p class="mt-4">
                The page is now at
                <a class="text-white underline underline-offset-4 decoration-neutral-600 transition-opacity hover:opacity-70" href="/art/essentialism/">/art/essentialism/</a>,
                under the
                <a class="text-white underline underline-offset-4 decoration-neutral-600 transition-opacity hover:opacity-70" href="/art/">art index</a>.
                Nothing about the piece changed; only its address did.
            </p>
        </main>
    </body>
</html>
