<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheBenMeadows Pendulum Simulator</title>
    <link rel="canonical" href="https://thebenmeadows.com/experiments/pendulum/" />
    <link rel="icon" href="/favicon/favicon.ico" type="image/x-icon" />
    <style>
        /* Custom Slider Styling for a minimal, technical look */
        input[type=range] {
            -webkit-appearance: none; 
            width: 100%; 
            background: transparent; 
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #e5e5e5;
            cursor: pointer;
            margin-top: -5px; 
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: #404040;
            border-radius: 1.3px;
        }
        
        /* The removed outline had no replacement, so all ten sliders lost their
           focus ring. The track is 2px tall, which also made the element box
           2px tall: the thumb is drawn outside it. Both are fixed here. */
        input[type=range]:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 4px;
        }

        input[type=range] {
            min-height: 24px;
        }

        .lock-btn {
            min-width: 24px;
            min-height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .lock-btn:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 2px;
        }

        /* Custom Scrollbar for the sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* Technical/Data font */
        }
        
        canvas {
            touch-action: none;
        }
        
        .lock-btn svg {
            width: 12px;
            height: 12px;
        }
    </style>
    <!-- Compiled locally from this page's classes; regenerate with `npm run build:experiments`.
         Replaces the Tailwind Play CDN - the site serves no external origins.
         Loaded AFTER the page <style> on purpose: the Play CDN injected its
         stylesheet last, so utilities win cascade ties against the page's own
         rules; the compiled sheet must sit in the same cascade position. -->
    <link rel="stylesheet" href="style.css" />
</head>

                    <div id="color-preview-line" class="w-6 h-6 rounded border border-gray-600" style="background-color: rgba(255,255,255,0.6);"></div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="p-6 border-t border-[#222] bg-[#0f0f0f]">
            <button id="btn-generate" class="w-full bg-white text-black py-3 text-xs font-bold tracking-widest hover:bg-gray-200 transition-colors uppercase">
                Generate System
            </button>
            <div class="flex gap-2 mt-3">
                <button id="btn-save-png" class="w-1/2 border border-[#333] text-gray-400 py-2 text-xs font-bold tracking-widest hover:text-white hover:border-white transition-colors uppercase">
                    Save PNG
                </button>
                <button id="btn-save-svg" class="w-1/2 border border-[#333] text-gray-400 py-2 text-xs font-bold tracking-widest hover:text-white hover:border-white transition-colors uppercase">
                    Save SVG
                </button>
            </div>
             <button id="btn-reset" class="w-full mt-2 border border-[#333] text-gray-500 py-2 text-[10px] font-bold tracking-widest hover:text-white hover:border-white transition-colors uppercase">
                Reset All
            </button>
        </div>

    </div>

    <!-- Externalized from an inline <script>: the site CSP is script-src 'self'. -->
    <script src="app.js"></script>
</body>
</html>
