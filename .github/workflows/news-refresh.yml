# Refresh /news once a day.
#
# fetch (read-only token, plus the model key): scripts/fetch-news.mjs reads GitHub
# releases, Zenodo, the experiment pages' first commits, and each finished week of
# merged pull requests on the sites in news/entries.json (a model writes that week's
# line, or declines) into news/sources.json; build-news rewrites the home page block.
#
# publish (write token, no model key): when either file changed, open a pull request
# with them, run checks.yml on it (the protect-main ruleset requires its `build`
# check, and pushes made with this token start no workflow by themselves, so the
# run is dispatched), and squash-merge it once green. The merge is what makes
# Cloudflare Pages and Netlify rebuild, both from the same committed data.
#
# report: a fetch problem (an API down, a refused or failed week) does not stop the
# rest from publishing, but it turns the run red so it is seen.
name: Refresh news

on:
  schedule:
    - cron: "17 13 * * *" # 06:17 Phoenix
  workflow_dispatch:

permissions: {}

concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  fetch:
    # A manual run started from another branch must not refresh from that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # fetch-news.mjs dates each experiment by the commit that added it.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The SDK has its own lock file under tools/news-refresh/, so the site's own
      # package.json and lock, which every host build installs, never contain it.
      - name: Install the refresh job's dependencies
        run: npm ci --prefix tools/news-refresh --no-audit --no-fund

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_PROBLEMS: ${{ runner.temp }}/news-problems.txt
        run: node scripts/fetch-news.mjs

      # The only clock read: NEWS_AS_OF ages old entries out of the home page block.
      - name: Rebuild the home page block
        run: NEWS_AS_OF="$(date -u +%F)" node scripts/build-news.mjs

      - name: Note what changed
        id: diff
        run: |
          if git diff --quiet -- news/sources.json index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p "$RUNNER_TEMP/out"
          cp news/sources.json index.html "$RUNNER_TEMP/out/"
          touch "$RUNNER_TEMP/news-problems.txt"
          cp "$RUNNER_TEMP/news-problems.txt" "$RUNNER_TEMP/out/"

      - name: Keep the result for the next jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: news-refresh
          path: ${{ runner.temp }}/out/
          retention-days: 7

  publish:
    needs: fetch
    if: needs.fetch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: news-refresh/${{ github.run_id }}
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Get the refreshed files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: news-refresh
          path: ${{ runner.temp }}/out

      # Only the data comes from the fetch job; the home page block is rebuilt here on
      # top of current main, so a change made to index.html in between is kept.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Close superseded refresh pull requests
        run: |
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("news-refresh/")) | .number' |
          while read -r n; do
            gh pr close "$n" --delete-branch --comment "Superseded by run ${{ github.run_id }}."
          done

      - name: Open the pull request
        id: pr
        run: |
          cp "$RUNNER_TEMP/out/sources.json" news/sources.json
          NEWS_AS_OF="$(date -u +%F)" node scripts/build-news.mjs
          if git diff --quiet -- news/sources.json index.html; then
            echo "main already has this data"
            echo "opened=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "$BRANCH"
          git add news/sources.json index.html
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Refresh news sources"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Refresh news sources" \
            --body "Daily refresh of news/sources.json and the home page News block by .github/workflows/news-refresh.yml (run ${{ github.run_id }}). Merged automatically once the build check passes."
          echo "opened=true" >> "$GITHUB_OUTPUT"

      # The check is dispatched (this token's pushes start no workflow) and the run
      # is found by the branch's head commit, so a slow-to-appear run or a run for an
      # earlier commit is never the one watched. If main moved, the branch is updated
      # once and checked again. The branch itself is deleted on merge by the repo
      # setting; a branch left by a failure is closed by the next run.
      - name: Check and merge
        if: steps.pr.outputs.opened == 'true'
        run: |
          set +e
          check() {
            sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --jq .commit.sha)
            gh workflow run checks.yml --ref "$BRANCH" || return 1
            run_id=""
            for _ in $(seq 1 30); do
              sleep 10
              run_id=$(gh run list --workflow checks.yml --branch "$BRANCH" --event workflow_dispatch \
                         --json databaseId,headSha --jq "map(select(.headSha == \"$sha\")) | .[0].databaseId // empty")
              [ -n "$run_id" ] && break
            done
            [ -n "$run_id" ] || { echo "::error::the dispatched check run never appeared"; return 1; }
            gh run watch "$run_id" --exit-status
          }
          for attempt in 1 2; do
            if ! check; then
              echo "::error::the build check did not pass on attempt $attempt"
              exit 1
            fi
            if gh pr merge "$BRANCH" --squash; then
              merged=1
              break
            fi
            state=$(gh pr view "$BRANCH" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$state" != "BEHIND" ] || ! gh pr update-branch "$BRANCH"; then
              break
            fi
          done
          if [ "${merged:-0}" != 1 ]; then
            echo "::error::the refresh pull request could not be merged; it is left open and the next run closes it"
            exit 1
          fi

      # After the hosts have had time to rebuild, so the hub fetches the new feed.
      - name: Ping the WebSub hub
        if: steps.pr.outputs.opened == 'true'
        run: |
          sleep 300
          curl -sS -m 30 --retry 2 -o /dev/null -w "%{http_code} hub ping\n" \
            -d "hub.mode=publish" --data-urlencode "hub.url=https://thebenmeadows.com/news/feed.xml" \
            "https://pubsubhubbub.appspot.com/" || true

  report:
    needs: [fetch, publish]
    if: always() && needs.fetch.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Get the refreshed files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: news-refresh
          path: out

      - name: Fail on fetch problems
        run: |
          # Problem text comes from APIs and the model, so "::" is broken up before it
          # is printed, or a message could issue workflow commands of its own.
          if [ -s out/news-problems.txt ]; then
            sed 's/::/: :/g' out/news-problems.txt | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
