# Run the repo's own guards on every push and pull request. They already
# existed and already fail loudly; nothing ran them, so a regression could
# only be caught by hand after it shipped -- which is how the Onion-Location
# headers stayed broken for six days.
#
# build:netlify is what both hosts run, and it ends in check-figures and
# check-onchain-code. Running it here means the manifest guards, the page
# budget, the webseed assertion and the on-chain byte comparison all gate a
# merge instead of only reporting after deploy.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # build-stamp, build-manifest and build-feed all read `git log -1`.
          # A shallow clone still satisfies that, but fetch the full history so
          # a future guard that walks further does not fail here first.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # .npmrc pins ignore-scripts, so this installs no lifecycle hooks.
      - name: Install
        run: npm ci

      - name: Check the readme mirror table against mirrors.json
        run: npm run check:readme

      - name: Check the mirrors page against mirrors.json
        run: npm run check:mirrors

      # Ends in check-figures.mjs and check-onchain-code.mjs.
      - name: Build and run the build-time guards
        run: npm run build:netlify

      # Renders dist/ in the runner's preinstalled Chrome and fails on body
      # copy past 75 characters a line, under 16px, or justified on a phone.
      # Its Safari pass skips itself on Linux; the safari job below runs it.
      - name: Line length and body size (check-measure)
        run: npm run check:measure

      # The shared Public Sans keeps its spaced-hyphen fix, tabular figures and
      # 400-700 weight axis (scripts/check-font.mjs; built by scripts/build-font.py).
      - name: Font (check-font)
        run: npm run check:font

      - name: css-touch-lint (hover, focus ring, :invalid, Tailwind flag, input size)
        run: python3 scripts/css-touch-lint.py
      - name: gitleaks (secrets in the pushed commits)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact
      - name: npm audit (high and critical advisories)
        run: npm audit --audit-level=high

  # Safari stretches justified lines differently from Chrome, and only macOS
  # WebKit measures what Safari shows (Linux WebKit read 15-37% wide word
  # spaces on pages that measure 4-5% in Safari). Builds dist/ here and runs
  # check-measure, whose WebKit pass fails a page where more than 15% of the
  # word spaces in justified body copy are wider than 0.5em.
  safari:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:netlify

      - name: Install WebKit
        run: npx playwright-core install webkit

      - name: Safari word spacing, line length and body size (check-measure)
        run: npm run check:measure
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
